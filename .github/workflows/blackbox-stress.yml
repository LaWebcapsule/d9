# Do not merge: lives only on ci/blackbox-stress to measure blackbox flakiness. Every push runs each vendor
# several times
name: Blackbox Stress

on:
  push:
    branches:
      - ci/blackbox-stress
  workflow_dispatch:

concurrency:
  group: blackbox-stress-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_OPTIONS: --max_old_space_size=6144

jobs:
  test:
    name: '${{ matrix.vendor }} #${{ matrix.attempt }}'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        vendor:
          - sqlite3
          - postgres
          - postgres10
          - mysql
          - mysql5
          - maria
          - mssql
          - oracle
        attempt: [1, 2, 3, 4, 5]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Prepare
        uses: ./.github/actions/prepare

      - name: Start services (SQLite)
        if: matrix.vendor == 'sqlite3'
        run:
          docker compose -f tests/blackbox/docker-compose.yml up auth-saml redis minio minio-mc -d --quiet-pull --wait

      - name: Start services (other vendors)
        if: matrix.vendor != 'sqlite3'
        run:
          docker compose -f tests/blackbox/docker-compose.yml up ${{ matrix.vendor }} auth-saml redis minio minio-mc -d
          --quiet-pull --wait

      - name: Run tests
        # Same log level as main ("error"), but the server output is kept for failed jobs
        run: TEST_DB=${{ matrix.vendor }} TEST_SAVE_LOGS=error pnpm run test:blackbox

      - name: Upload server logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-logs-${{ matrix.vendor }}-${{ matrix.attempt }}
          path: tests/blackbox/server-log-*.txt
          if-no-files-found: ignore
