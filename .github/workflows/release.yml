name: Release

# Runs on every push to main, but only releases right after a Version Packages PR is merged:
# no changesets left and package versions not yet published to npm.
on:
  push:
    branches:
      - main

concurrency:
  group: release
  cancel-in-progress: false

env:
  GHCR_IMAGE: ghcr.io/${{ github.repository }}
  DOCKERHUB_IMAGE: lawebcapsule/d9
  DOCKERHUB_IMAGE_OLD: lawebcapsule/directus9

jobs:
  select-mode:
    name: Select Mode
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.select-mode.outputs.mode }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Prepare
        uses: ./.github/actions/prepare
        with:
          build: false

      - name: Select Changesets mode
        id: select-mode
        uses: changesets/action/select-mode@v2

      - name: Read version
        id: version
        run: echo "version=$(node -p "require('./directus/package.json').version")" >> "$GITHUB_OUTPUT"

  create-release:
    name: Create Release
    needs: select-mode
    if: needs.select-mode.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      # Notes: a Security section with the "security:" changelog entries, then the new changelog section
      # of every public package released since the previous v* tag
      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.select-mode.outputs.version }}
        run: |
          previous_tag=$(git describe --tags --abbrev=0 --match 'v*' || true)
          dependencies_only=()
          : > changes.md

          # Candidates: packages whose CHANGELOG.md or package.json changed since the previous tag
          candidates=$(git log --name-only --format= ${previous_tag:+"$previous_tag..HEAD"} -- '*CHANGELOG.md' '*package.json' | xargs -r -n1 dirname | sort -u)

          for dir in $candidates; do
            manifest="$dir/package.json"
            [ -f "$manifest" ] && [ -f "$dir/CHANGELOG.md" ] || continue

            read -r name version private <<< "$(node -p "const p = require('./$manifest'); [p.name, p.version, Boolean(p.private)].join(' ')")"
            [ "$private" = true ] && continue

            previous=$(git show "$previous_tag:$manifest" 2> /dev/null | node -p "JSON.parse(require('fs').readFileSync(0)).version" 2> /dev/null || true)
            [ "$version" = "$previous" ] && continue

            section=$(awk -v v="$version" '$0 == "## " v {f=1; next} /^## /{f=0} f' "$dir/CHANGELOG.md")

            # No entry other than "Updated dependencies": just list the package at the end
            if ! grep -E '^- ' <<< "$section" | grep -vq '^- Updated dependencies'; then
              dependencies_only+=("\`$name@$version\`")
              continue
            fi

            printf '## %s %s\n%s\n\n' "$name" "$version" "$section" >> changes.md
          done

          if [ ${#dependencies_only[@]} -gt 0 ]; then
            echo "**Dependency updates only:** ${dependencies_only[*]}" >> changes.md
          fi

          # Changelog entries span several lines: join each one, keep the "security:" ones once
          security=$(awk '
            function flush() { if (entry != "" && tolower(entry) ~ /(^- |! - )security:/ && !seen[entry]++) print entry; entry = "" }
            /^- / { flush(); entry = $0; next }
            /^  [^ -]/ && entry != "" { sub(/^ +/, ""); entry = entry " " $0; next }
            { flush() }
            END { flush() }
          ' changes.md)

          {
            echo '## Security'
            echo
            echo "${security:-No security fixes in this release.}"
            echo
            cat changes.md
          } > notes.md

          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION" --notes-file notes.md

  publish-npm:
    name: Publish to NPM
    needs: select-mode
    if: needs.select-mode.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Prepare
        uses: ./.github/actions/prepare
        with:
          registry: https://registry.npmjs.org

      - name: Switch to Node 24 for Trusted Publishing
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Reinstall pnpm for Node 24
        uses: pnpm/action-setup@v4

      - name: Publish packages to NPM
        env:
          NPM_CONFIG_PROVENANCE: "true"
        run: pnpm --recursive publish --access=public --no-git-checks --provenance

  build-images:
    name: Build Images
    needs: select-mode
    if: needs.select-mode.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v2

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Cache Docker layers
        uses: actions/cache@v3
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Extract metadata for Docker image
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: |
            ${{ env.DOCKERHUB_IMAGE }}
            ${{ env.DOCKERHUB_IMAGE_OLD }}
            ${{ env.GHCR_IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=v${{ needs.select-mode.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ needs.select-mode.outputs.version }}
            type=semver,pattern={{major}},value=v${{ needs.select-mode.outputs.version }}

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        if: env.DOCKERHUB_IMAGE
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Login to GHCR
        uses: docker/login-action@v2
        if: env.GHCR_IMAGE
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v3
        with:
          context: .
          file: ./Dockerfile
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new

      # Temp fix:
      # https://github.com/docker/build-push-action/issues/252
      # https://github.com/moby/buildkit/issues/1896
      - name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache
