get:
  summary: Retrieve an Item
  description: Retrieve a single item by unique identifier.
  tags:
    - Items
  operationId: getItem
  parameters:
    - $ref: '../../openapi.yaml#/components/parameters/Fields'
    - $ref: '../../openapi.yaml#/components/parameters/Meta'
  responses:
    '200':
      description: Successful request
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: object
    '401':
      $ref: '../../openapi.yaml#/components/responses/UnauthorizedError'
    '404':
      $ref: '../../openapi.yaml#/components/responses/NotFoundError'

patch:
  summary: Update an Item
  description: >-
    Update an existing item. To detect changes someone else saved in the meantime, add `onlyIf` to the reserved
    `$__meta` key of the body (also in nested items): the conditions the current values have to meet, by field. The
    operators are `_sha256`, the SHA-256 digest of the value the changes are based on, and `_eq`, the value itself. The
    `$__meta` of nested `delete` alterations can contain `deleteOnlyIf` with the conditions by primary key. If any of
    the conditions isn't met, nothing is saved and the API responds with 409 CONFLICT.
  tags:
    - Items
  operationId: updateItem
  parameters:
    - $ref: '../../openapi.yaml#/components/parameters/Fields'
    - $ref: '../../openapi.yaml#/components/parameters/Meta'
  requestBody:
    content:
      application/json:
        schema:
          type: object
          properties:
            $__meta:
              $ref: '../../openapi.yaml#/components/schemas/UpdateMeta'
  responses:
    '200':
      description: Successful request
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: object
    '401':
      $ref: '../../openapi.yaml#/components/responses/UnauthorizedError'
    '404':
      $ref: '../../openapi.yaml#/components/responses/NotFoundError'
    '409':
      $ref: '../../openapi.yaml#/components/responses/ConflictError'

delete:
  summary: Delete an Item
  description: Delete an existing item.
  tags:
    - Items
  operationId: deleteItem
  responses:
    '204':
      description: Successful request
    '401':
      $ref: '../../openapi.yaml#/components/responses/UnauthorizedError'
    '404':
      $ref: '../../openapi.yaml#/components/responses/NotFoundError'
parameters:
  - $ref: '../../openapi.yaml#/components/parameters/Collection'
  - name: id
    description: Index of the item.
    in: path
    required: true
    schema:
      oneOf:
        - type: integer
          description: Incremental index of the item.
          example: 1
        - type: string
          description: Unique identifier of the item.
          example: 8cbb43fe-4cdf-4991-8352-c461779cec02
